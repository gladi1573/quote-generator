{% extends "base.html" %}

{% block content %}
    <h1>Quote of the Day</h1>
    {% if search %}
        <p class="search-info">Search results for: "{{ search }}"</p>
    {% endif %}
    <p class="quote">{{ quote }}</p>
    {% if author %}
        <p class="author">— {{ author }}</p>
        <form action="{{ url_for('add_favourite') }}" method="post">
            <input type="hidden" name="quote" value="{{ quote }}">
            <input type="hidden" name="author" value="{{ author }}">
            <button type="submit" class="fav-btn">♥ Save</button>
        </form>
    {% endif %}
    <form action="{{ url_for('home') }}" method="get" class="search">
        <input type="text" name="author" placeholder="Search by author..." value="{{ search }}">
        <button type="submit">Search</button>
    </form>
    <a class="btn" href="{{ url_for('home') }}">New Quote</a>
    <a class="fav-link" href="{{ url_for('show_favourites') }}">♥ My Favourites</a>
{% endblock %}
