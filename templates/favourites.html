{% extends "base.html" %}

{% block title %}My Favourites{% endblock %}

{% block content %}
    <h1>My Favourites</h1>
    {% for fav in favourites %}
        <p class="quote">{{ fav.quote }}</p>
        <p class="author">— {{ fav.author }}</p>
    {% else %}
        <p>No favourites yet.</p>
    {% endfor %}
    <a class="btn" href="{{ url_for('home') }}">← Back</a>
{% endblock %}
